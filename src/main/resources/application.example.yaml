spring:
  application:
    name: GastroGuideMichelin
  datasource:
    driver-class-name: org.h2.Driver
    username: #####
    password: #####
    url: jdbc:h2:./db_name;AUTO_SERVER=TRUE
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    generate-ddl: true
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
  h2:
    console:
      enabled: true
  cloud:
    aws:
      credentials:
        access-key: #####
        secret-key: #####
      region:
        static:
          region: us-east-1
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://keycloak.bober.ovh/realms/master
          jwk-set-uri: https://keycloak.bober.ovh/realms/master/protocol/openid-connect/certs
cloud:
  aws:
    s3:
      endpoint: https://s3.bober.ovh
      restaurant-bucket: restaurant
      evaluation-bucket: evaluation
